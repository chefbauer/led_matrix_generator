# LED-Matrix Konfiguration
# Ausgabe: output/XL-1615RGBC_5x5.zip

[matrix]
cols           = 5
rows           = 5
pitch          = 2.5
margin         = 0
# busbar: 0 = keine, 1 = links
busbar         = 1
# led_current_ma: mA pro LED (weiss = 15mA, RGB max = 45mA)
led_current_ma = 15.0
# copper_oz: 1 oder 2
copper_oz      = 1

[led]
jlcpcb_part = C41413180
