# LED-Matrix Konfiguration
# Ausgabe: output/XL-1615_8x8.zip
# Beispiel dokumentiert in docs/example_8x8/

[matrix]
cols           = 8
rows           = 8
pitch          = 3.0
margin         = 0
# busbar: 0 = keine, 1 = links (v2-Generator: Anschlusspads randbuendig)
busbar         = 0
# led_current_ma: mA pro LED (weiss = 15mA, RGB max = 45mA)
led_current_ma = 15.0
# copper_oz: 1 oder 2
copper_oz      = 1

[led]
jlcpcb_part = C41413180
