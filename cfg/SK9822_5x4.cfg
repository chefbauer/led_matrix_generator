# LED-Matrix Konfiguration
# Ausgabe: output/SK9822_5x4.zip

[matrix]
cols           = 5
rows           = 4
pitch          = 5.0
margin         = 0
# busbar: 0 = keine, 1 = links
busbar         = 1
# led_current_ma: mA pro LED (weiss = 15mA, RGB max = 45mA)
led_current_ma = 15.0
# copper_oz: 1 oder 2
copper_oz      = 1

[led]
jlcpcb_part = C2909059
